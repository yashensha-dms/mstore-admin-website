<VirtualHost *:80>
    ServerName mstore.primeads.ai
    ServerAlias mstore.primeads.ai

    ProxyPreserveHost On
    RewriteEngine On

    # --- DO NOT TOUCH phpMyAdmin ---
    RewriteRule ^/phpmyadmin - [L]

    ProxyPass /phpmyadmin !
    Alias /phpmyadmin /usr/share/phpmyadmin

    <Directory /usr/share/phpmyadmin>
        Options SymLinksIfOwnerMatch
        DirectoryIndex index.php
        AllowOverride All
        Require all granted
    </Directory>
    # --- END phpMyAdmin ---

    # Redirect everything else to HTTPS
    RewriteCond %{REQUEST_URI} !^/phpmyadmin
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    # --- ADMIN DASHBOARD (Next.js) ---
    ProxyPass /admin/ http://127.0.0.1:3000/admin/
    ProxyPassReverse /admin/ http://127.0.0.1:3000/admin/

    # --- LARAVEL BACKEND ---
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog ${APACHE_LOG_DIR}/mstore_error.log
    CustomLog ${APACHE_LOG_DIR}/mstore_access.log combined
</VirtualHost>
